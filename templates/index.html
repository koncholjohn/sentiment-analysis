<!DOCTYPE html>
<html>
<head>
    <title>Sentiment Analyzer</title>

    <style>

        body{
            font-family: Arial;
            background:#f4f4f4;
            padding:40px;
        }

        .container{
            width:500px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
        }

        textarea{
            width:100%;
            height:150px;
            padding:10px;
        }

        button{
            padding:10px 20px;
            background:blue;
            color:white;
            border:none;
            margin-top:10px;
            cursor:pointer;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Sentiment Analyzer System</h2>

    <form action="/analyze" method="POST">

        <textarea
            name="text"
            placeholder="Enter text here..."
            required>
        </textarea>

        <br>

        <button type="submit">
            Analyze Sentiment
        </button>

    </form>

</div>

</body>
</html>
